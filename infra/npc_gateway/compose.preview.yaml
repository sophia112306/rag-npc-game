name: rag-npc-gateway-preview

services:
  gateway_preview:
    image: rag-npc-model-runtime:vllm-0.31.0
    container_name: rag-npc-gateway-preview
    restart: unless-stopped
    network_mode: host
    working_dir: /workspace/rag-npc-game
    command:
      - python3
      - -m
      - uvicorn
      - gpu_gateway.app:app
      - --host
      - 127.0.0.1
      - --port
      - "8003"
    environment:
      PYTHONPATH: /workspace/rag-npc-game
      PYTHONDONTWRITEBYTECODE: "1"
      VLLM_BASE_URL: http://127.0.0.1:8001/v1
      VLLM_UPSTREAM_MAX_ATTEMPTS: "1"
      NARRATOR_UPSTREAM_MAX_ATTEMPTS: "2"
      VLLM_UPSTREAM_TIMEOUT_SECONDS: "25"
      NPC_SEMANTIC_REVIEW_ENABLED: "true"
    volumes:
      - ../..:/workspace/rag-npc-game:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://127.0.0.1:8003/health"]
      interval: 30s
      timeout: 7s
      retries: 3
      start_period: 30s
