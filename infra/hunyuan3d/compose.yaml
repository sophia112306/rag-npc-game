name: rag-npc-hunyuan3d

services:
  api:
    build:
      context: .
      args:
        HUNYUAN3D_COMMIT: f8db63096c8282cb27354314d896feba5ba6ff8a
    image: rag-npc-hunyuan3d:2.0-mini-cu128
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${HUNYUAN3D_PORT:-8081}:8081"
    devices:
      - "nvidia.com/gpu=all"
    environment:
      HUNYUAN3D_MODEL: tencent/Hunyuan3D-2mini
      HUNYUAN3D_SUBFOLDER: hunyuan3d-dit-v2-mini-turbo
      HUNYUAN3D_OUTPUT_DIR: /outputs
      HUNYUAN3D_MAX_INPUT_BYTES: "12582912"
      HF_HOME: /models/huggingface
      HY3DGEN_MODELS: /models/hy3dgen
      U2NET_HOME: /models/u2net
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    volumes:
      - hunyuan3d-models:/models
      - hunyuan3d-outputs:/outputs
    shm_size: "8gb"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=5)); assert data['status'] == 'ready'"
      interval: 30s
      timeout: 10s
      start_period: 20m
      retries: 3

volumes:
  hunyuan3d-models:
  hunyuan3d-outputs:
